name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Restore Bazel disk cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: telegram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc', 'WORKSPACE', 'MODULE.bazel', 'build-system/Make/**') }}-${{ github.sha }}
          restore-keys: |
            telegram-bazel-${{ runner.os }}-${{ hashFiles('versions.json', '.bazelrc', 'WORKSPACE', 'MODULE.bazel', 'build-system/Make/**') }}-
            telegram-bazel-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(echo $APP_VERSION)" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          IPA_PATH="bazel-bin/Telegram/Telegram.ipa"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          if [[ ! -f "$IPA_PATH" ]]; then
            echo "error: IPA not found at $IPA_PATH" >&2
            exit 1
          fi

          cp "$IPA_PATH" "$OUTPUT_PATH/Partygram.ipa"

          # collect dSYM bundles when present
          DSYM_PATH="build/DSYMs"
          rm -rf "$DSYM_PATH"
          mkdir -p "$DSYM_PATH"

          while IFS= read -r -d '' dsym; do
            cp -R "$dsym" "$DSYM_PATH/"
          done < <(find bazel-bin/Telegram -maxdepth 1 -type d -name '*.dSYM' -print0)

          if find "$DSYM_PATH" -mindepth 1 -maxdepth 1 -type d -name '*.dSYM' | grep -q .; then
            zip -qr "$OUTPUT_PATH/Partygram.DSYMs.zip" "$DSYM_PATH"
          else
            echo "warning: no dSYM bundles found; creating an empty archive" >&2
            zip -qr "$OUTPUT_PATH/Partygram.DSYMs.zip" "$DSYM_PATH"
          fi

      - name: Save Bazel disk cache
        if: steps.bazel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partygram-build-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: partygram-${{ env.APP_VERSION }}-build-${{ env.BUILD_NUMBER }}
          release_name: Partygram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Partygram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Partygram.ipa
          asset_name: Partygram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Partygram.DSYMs.zip
          asset_name: Partygram.DSYMs.zip
          asset_content_type: application/zip
